<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校规问答 Agent · 数据中台</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel-2:#fafbfe; --line:#e3e8f0; --fg:#1b2029;
  --muted:#6b7485; --accent:#2f5fe0; --accent-2:#eaf0ff; --accent-fg:#ffffff;
  --ok:#0f7b4f; --ok-bg:#e8f6ef; --err:#b42318; --err-bg:#fdeceb;
  --warn:#9a5b00; --warn-bg:#fff5e2; --chip:#eef2f8; --code:#f6f8fc;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 28px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1218;--panel:#181d26;--panel-2:#1d232e;--line:#2c3341;--fg:#e9edf5;
  --muted:#98a2b3;--accent:#86a9ff;--accent-2:#202b45;--accent-fg:#0f1218;
  --ok:#5ad39b;--ok-bg:#162b23;--err:#ff8f85;--err-bg:#2e1c1c;
  --warn:#e8b562;--warn-bg:#33291b;--chip:#232a36;--code:#141922;
  --shadow:0 1px 2px rgba(0,0,0,.2),0 8px 28px rgba(0,0,0,.25);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:28px 22px 64px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-size:20px;margin:0;font-weight:680;letter-spacing:.2px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-fg);
  display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}
.pill{font-size:11.5px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);
  background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.notice{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--panel);
  border-radius:10px;padding:11px 14px;font-size:12.5px;color:var(--muted);margin-bottom:20px}
.notice b{color:var(--fg)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:11.5px;color:var(--muted);letter-spacing:.3px}
.kpi .val{font-size:27px;font-weight:700;line-height:1.25;margin-top:5px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.kpi.a .val{color:var(--accent)} .kpi.b .val{color:var(--err)}
.kpi.c .val{color:var(--warn)} .kpi.d .val{color:var(--ok)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);overflow:hidden}
.card h2{font-size:14px;margin:0;padding:14px 17px;border-bottom:1px solid var(--line);
  font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 .ic{color:var(--accent)}
.card h2 .sp{flex:1}
.card h2 .note{font-size:11px;color:var(--muted);font-weight:400}
.card .body{padding:15px 17px 17px}
.row{margin-bottom:11px}
.row:last-child{margin-bottom:0}
.row .rh{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px}
.row .rh .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rh .ct{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .rh .pc{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:56px;text-align:right}
.track{height:7px;border-radius:5px;background:var(--chip);overflow:hidden}
.track > span{display:block;height:100%;border-radius:5px;background:var(--accent);min-width:2px}
.track.err > span{background:var(--err)}
.track.warn > span{background:var(--warn)}
.big{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.big .n{font-size:34px;font-weight:720;color:var(--err);font-variant-numeric:tabular-nums}
.big .d{font-size:12.5px;color:var(--muted)}
.divider{height:1px;background:var(--line);margin:14px 0}
.mini{font-size:11.5px;color:var(--muted);letter-spacing:.4px;margin:0 0 9px}
.trend{display:flex;align-items:flex-end;gap:5px;height:52px;margin-bottom:6px}
.trend .col{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;gap:2px}
.trend .bar{width:100%;background:var(--accent-2);border-radius:3px 3px 0 0;min-height:2px}
.trend .bar.hot{background:var(--err)}
.trend .cap{font-size:9.5px;color:var(--muted);white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;
  padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.rank{color:var(--muted);font-variant-numeric:tabular-nums;width:34px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.doc{font-weight:560;word-break:break-word}
.tag{font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  color:var(--muted);white-space:nowrap}
.tag.real{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.derived{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.foot2{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}
.foot2 b{color:var(--fg)}
.foot2 ul{margin:7px 0 0;padding-left:19px}
.foot2 li{margin-bottom:4px}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.src{font-size:11px;background:var(--code);border:1px solid var(--line);
  border-radius:6px;padding:2px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:12.5px;padding:14px 0}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
</style>
</head>

      <span class="ct">${num(count)} 次</span>
      <span class="pc">${esc(pct(rate))}</span>

    const w = Math.max(1.5, d.count / dmax * 100);
    const real = d.sources.some(s => s.indexOf('replay:run:') === 0);
    const derived = d.sources.some(s => s.indexOf('replay:title_hit') === 0);
    const tags = (derived ? '<span class="tag derived">回放推导</span> ' : '') +
      (real ? '<span class="tag real">真实运行记录</span>' : '');
    return `<tr>
      <td class="rank">${i + 1}</td>
      <td class="doc">${esc(d.display_title)}</td>
      <td class="num">${num(d.count)} 次</td>
      <td style="min-width:120px"><div class="track"><span style="width:${w.toFixed(1)}%"></span></div></td>
      <td class="num">${esc(pct(d.rate))}</td>
      <td class="num">${d.pages ? d.pages + ' 页' : '—'}</td>
      <td class="num">${d.avg_score == null ? '—' : Number(d.avg_score).toFixed(4)}</td>
      <td>${tags || '<span class="tag">回放</span>'}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="8" class="empty">暂无采纳证据记录。</td></tr>';

  const srcHtml = (D.sources || []).slice(0, 8).map(s =>
    `<span class="src">${esc(s.source)} · ${num(s.count)}</span>`).join('');
  const dictHtml = D.topics.dictionary.map(d =>
    `${esc(d.topic)}(${d.keyword_count})`).join('、');

  $('#app').innerHTML = `
    <div class="kpis">${kpis}</div>
    <div class="grid">
      <section class="card">
        <h2><span class="ic">▤</span> 提示词关键词输入率
          <span class="sp"></span><span class="note">主题词典命中 / 请求总数</span></h2>
        <div class="body">${topicHtml}
          <div class="divider"></div>
          <div class="mini">口径与词典（${D.topics.dictionary.length} 类主题）</div>
          <div style="font-size:11.5px;color:var(--muted)">${esc(t.note)}</div>
          <div style="font-size:11.5px;color:var(--muted);margin-top:6px">${esc(dictHtml)}</div>
        </div>
      </section>
      <section class="card">
        <h2><span class="ic">⛨</span> 拦截率
          <span class="sp"></span><span class="note">query_guard 入口层</span></h2>
        <div class="body">
          <div class="big"><span class="n">${esc(pct(g.rate))}</span>
            <span class="d">${num(g.blocked)} 次拦截 / ${num(o.total_queries)} 次请求</span></div>
          <div class="mini">按命中的过滤规则拆分（规则命中次数，合计 ${num(g.rule_hits)}）</div>
          ${ruleHtml}
          <div class="divider"></div>
          <div class="mini">按天趋势（柱高＝请求数，红色＝当天有拦截）</div>
          ${trendHtml}
        </div>
      </section>
    </div>
    <section class="card" style="margin-bottom:16px">
      <h2><span class="ic">▣</span> 被索引最多的数据
        <span class="sp"></span><span class="note">Top ${ds.top_n} · 最终采纳的 E1..En 证据</span></h2>
      <div class="body" style="padding:0 0 2px">
        <table><thead><tr>
          <th>#</th><th>校规文档</th><th>采纳次数</th><th>相对热度</th>
          <th>证据占比</th><th>涉及页码</th><th>平均相关度</th><th>来源</th>
        </tr></thead><tbody>${docRows}</tbody></table>
      </div>
    </section>
    <section class="foot2">
      <b>口径与隐私</b>
      <ul>
        <li><b>关键词输入率</b>：一条输入可命中多个主题，各项占比之和可能超过 100%；「未归类」多为域外提问。</li>
        <li><b>拦截率</b>只统计 query_guard 在检索前的入口拦截（0 次模型调用），分子是<b>被拦请求数</b>；一次请求可命中多条规则，因此按规则拆分的命中次数合计可能大于该数。检索后红线拒答单独列在 KPI，两者不可混算。</li>
        <li><b>被索引最多的数据</b>按清洗后的文档标题归并（去掉日期前缀与校名前缀），统计最终采纳证据，不含未采用的召回候选。</li>
        <li><b>${esc(D.privacy.stores_raw_prompt ? '会' : '不会')}存用户提示词原文</b>：${esc(D.privacy.note)}。事件库为独立 var/analytics.db，与短期记忆 memory.db 物理分离。</li>
        <li>历史回放的 19 个评测批次跑的是同一套 25 题金标题库，主题分布会被重复放大；看板已标注回放与真实运行的事件数。</li>
      </ul>
      <div class="mini" style="margin-top:12px">事件来源分布（前 8）</div>
      <div class="srcs">${srcHtml || '<span class="src">（无）</span>'}</div>
    </section>`;
}

if (typeof DATA === 'undefined') { noData(); } else { render(DATA); }
</script>
</body>
</html>
